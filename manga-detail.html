<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#292929">
  <title>Manga Details | MAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main-nav.css?v=account-menu-settings-v9-202610">
  <style>
    .detail-main { width: min(100%, 1000px); margin: 42px auto 0; text-align: left; }
    .detail-hero { display: grid; grid-template-columns: minmax(190px, 290px) minmax(0, 1fr); gap: 32px; align-items: start; }
    .detail-cover { display: block; width: 100%; aspect-ratio: 2 / 3; border: 1px solid rgba(191, 233, 255, .4); border-radius: 8px; background: #333; object-fit: cover; }
    .detail-copy h1 { margin: 0 0 12px; font-size: 2rem; text-align: left; }
    .detail-facts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 20px; color: #f1dfbd; }
    .detail-facts p { margin: 0; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 24px; }
    .detail-actions button, .bookmark-dialog button { min-height: 44px; padding: 9px 16px; border: 1px solid #bfe9ff; border-radius: 6px; background: #bfe9ff; color: #292929; font: 600 1rem "Fredoka", "Arial Rounded MT Bold", sans-serif; cursor: pointer; }
    .detail-actions button:hover, .bookmark-dialog button:hover { background: #fff; }
    .detail-actions .secondary, .bookmark-dialog .secondary { background: transparent; color: #bfe9ff; }
    .detail-actions .secondary:hover, .bookmark-dialog .secondary:hover { background: #3b4246; }
    .detail-actions .favorite-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    .favorite-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .favorite-button[aria-pressed="true"] { border-color: #f1dfbd; background: #f1dfbd; color: #292929; }
    .favorite-button[aria-pressed="true"] svg { fill: currentColor; }
    .save-status { min-height: 1.4em; margin: -12px 0 18px; color: #f1dfbd; }
    .detail-copy h2 { margin: 22px 0 8px; color: #bfe9ff; font: 600 1.3rem "Fredoka", "Arial Rounded MT Bold", sans-serif; }
    .synopsis { margin: 0; color: #e0e0e0; line-height: 1.7; white-space: pre-line; }
    .suggestions-section { margin-top: 26px; }
    .suggestions-section h2 { margin-top: 0; }
    .suggested-manga-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px 12px; margin-top: 14px; }
    .suggested-manga { min-width: 0; color: #bfe9ff; text-decoration: none; }
    .suggested-manga:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .suggested-manga img, .suggested-cover-placeholder { display: grid; width: 100%; aspect-ratio: 2 / 3; place-items: center; border: 1px solid rgba(191, 233, 255, .4); border-radius: 6px; background: #292929; color: #aab7bc; object-fit: cover; text-align: center; }
    .suggested-manga:hover img, .suggested-manga:hover .suggested-cover-placeholder { border-color: #bfe9ff; transform: translateY(-2px); }
    .suggested-manga-label { display: block; margin-top: 7px; color: #f1dfbd; font: 500 .72rem/1.25 "Fredoka", "Arial Rounded MT Bold", sans-serif; }
    .suggested-manga-title { display: -webkit-box; overflow: hidden; margin-top: 4px; color: #bfe9ff; font: 500 .85rem/1.3 "Fredoka", "Arial Rounded MT Bold", sans-serif; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .suggestions-retry { margin-top: 10px; padding: 8px 12px; border: 1px solid #bfe9ff; border-radius: 4px; background: transparent; color: #bfe9ff; font: 500 .9rem "Fredoka", "Arial Rounded MT Bold", sans-serif; cursor: pointer; }
    .suggestions-retry:hover { background: #3b4246; }
    .detail-status { color: #d3d3d3; }
    .bookmark-dialog { width: min(92vw, 460px); max-height: min(88vh, 720px); padding: 24px; border: 1px solid rgba(191, 233, 255, .6); border-radius: 8px; background: #333; color: #bfe9ff; }
    .bookmark-dialog::backdrop { background: rgba(0, 0, 0, .74); }
    .bookmark-dialog h2 { margin: 0 0 18px; font: 600 1.5rem "Fredoka", "Arial Rounded MT Bold", sans-serif; }
    .bookmark-dialog label { display: block; margin: 14px 0 6px; font: 500 1rem "Fredoka", "Arial Rounded MT Bold", sans-serif; }
    .bookmark-dialog input, .bookmark-dialog textarea { width: 100%; min-height: 44px; padding: 10px; border: 1px solid #8199a3; border-radius: 4px; background: #252525; color: #fff; font: 1rem "Avenir Next", Avenir, sans-serif; }
    .bookmark-dialog textarea { min-height: 110px; resize: vertical; }
    .completion-option { display: flex !important; align-items: center; gap: 9px; margin-top: 16px !important; cursor: pointer; }
    .completion-option input { width: 18px; min-height: 18px; margin: 0; accent-color: #68c7f4; }
    .completion-status { min-height: 1.3em; margin: 6px 0 0; color: #f1dfbd; font: 400 .85rem "Avenir Next", Avenir, sans-serif; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    @media (max-width: 650px) {
      .detail-main { margin-top: 30px; }
      .detail-hero { grid-template-columns: minmax(105px, 34%) minmax(0, 1fr); gap: 16px; }
      .detail-copy h1 { font-size: 1.55rem; }
      .detail-actions { flex-direction: column; align-items: stretch; }
      .detail-actions button { width: 100%; }
    }
    @media (max-width: 430px) { .detail-hero { grid-template-columns: 1fr; } .detail-cover { width: min(62%, 230px); } }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a href="anime.html">Anime</a>
      <a href="manga.html" aria-current="page">Manga</a>
      <a href="my-tracker.html?v=tracker-bookmark-filters-v3-202610">My Tracker</a>
    </nav>
    <a class="ramen-link" href="main-home.html" aria-label="Return to the main page"><img src="ramen.svg" alt=""></a>
    <div class="account-actions">
      <a class="profile-link" href="my-tracker.html?v=tracker-bookmark-filters-v3-202610" aria-label="Open your profile and tracker" title="Profile and tracker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c0-4.1 2.8-6.5 7-6.5s7 2.4 7 6.5Z"></path></svg>
      </a>
      <button class="logout-button" id="logout-button" type="button">Log out</button>
    </div>
  </header>
  <main class="detail-main">
    <p class="detail-status" id="manga-detail-status" role="status">Loading manga details...</p>
    <section class="detail-hero" id="manga-detail-hero" hidden>
      <img class="detail-cover" id="manga-cover" alt="">
      <div class="detail-copy">
        <h1 id="manga-title"></h1>
        <div class="detail-facts" id="manga-facts"></div>
        <div class="detail-actions">
          <button type="button" id="manga-watch-later">Save to read later</button>
          <button type="button" class="secondary" id="open-manga-bookmark">Bookmark</button>
          <button type="button" class="secondary favorite-button" id="favorite-manga" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9Z"></path></svg>
            <span>Favorite</span>
          </button>
        </div>
        <p class="save-status" id="manga-save-status" aria-live="polite"></p>
        <h2>Summary</h2>
        <p class="synopsis" id="manga-synopsis"></p>
        <section class="suggestions-section" aria-labelledby="manga-suggestions-heading">
          <h2 id="manga-suggestions-heading">If you liked this, try:</h2>
          <p class="detail-status" id="manga-suggestions-status" role="status">Finding similar manga...</p>
          <button class="suggestions-retry" id="retry-manga-suggestions" type="button" hidden>Try again</button>
          <div class="suggested-manga-grid" id="suggested-manga"></div>
        </section>
      </div>
    </section>
  </main>
  <dialog class="bookmark-dialog" id="manga-bookmark-dialog" aria-labelledby="manga-bookmark-heading">
    <form id="manga-bookmark-form">
      <h2 id="manga-bookmark-heading">Your reading progress</h2>
      <label for="volume-progress">Volume</label>
      <input id="volume-progress" name="volume" type="number" min="1" value="1" required>
      <label for="chapter-progress">Chapter</label>
      <input id="chapter-progress" name="chapter" type="number" min="0" value="0" required>
      <label class="completion-option" for="manga-completed"><input id="manga-completed" name="completed" type="checkbox"><span>Completed</span></label>
      <p class="completion-status" id="manga-completion-status" role="status" aria-live="polite"></p>
      <label for="manga-comment">My comment</label>
      <textarea id="manga-comment" name="comment" placeholder="Add a note to remember this manga"></textarea>
      <p class="completion-status" id="manga-comment-count" role="status" aria-live="polite">0 / 1,600 words</p>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="cancel-manga-bookmark">Cancel</button>
        <button type="submit">Submit</button>
      </div>
    </form>
  </dialog>
  <script src="auth.js?v=account-menu-settings-v7-202610"></script>
  <script src="manga-detail.js?v=manga-detail-internal-manga-202610"></script>
</body>
</html>
