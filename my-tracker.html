<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main-nav.css?v=account-menu-settings-v9-202610">
  <style>
    .tracker-content {
      width: min(100%, 900px);
      margin: 42px auto 0;
    }

    .last-login {
      margin: 18px 4px 0;
      color: #bfe9ff;
      font: 500 1rem "Fredoka", "Arial Rounded MT Bold", sans-serif;
    }

    .last-login time {
      color: #f1dfbd;
    }

    .bookmark-list {
      display: grid;
      gap: 16px;
      margin-top: 42px;
      text-align: left;
    }

    .bookmark-list h1 {
      font-size: 1.8rem;
      text-align: left;
    }

    .tracker-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(12px, 2.2vw, 26px);
      row-gap: 6px;
      margin-top: 42px;
      border-bottom: 1px solid rgba(191, 233, 255, 0.28);
    }

    .media-tabs {
      display: flex;
      width: fit-content;
      max-width: 100%;
      gap: 26px;
      margin-top: 38px;
      border-bottom: 1px solid rgba(191, 233, 255, 0.32);
    }

    .media-tab {
      min-height: 48px;
      padding: 8px 4px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #bfe9ff;
      font: 600 1.2rem "Fredoka", "Arial Rounded MT Bold", sans-serif;
      cursor: pointer;
    }

    .media-tab[aria-selected="true"] {
      border-bottom-color: #f1dfbd;
      color: #fff;
    }

    .media-tab:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .media-section[hidden],
    .tracker-panel[hidden] {
      display: none;
    }

    .media-section > .tracker-tabs {
      margin-top: 0;
    }

    .tracker-tab {
      min-height: 44px;
      padding: 8px 2px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #bfe9ff;
      font: 600 1rem "Fredoka", "Arial Rounded MT Bold", sans-serif;
      cursor: pointer;
    }

    .tracker-tab[aria-selected="true"] {
      border-bottom-color: #f1dfbd;
      color: #fff;
    }

    .tracker-tab:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .bookmark-filters { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 6px; }
    .bookmark-filter { min-height: 32px; padding: 5px 12px; border: 1px solid rgba(191, 233, 255, .44); border-radius: 999px; background: #333; color: #d3d3d3; font: 500 .82rem "Fredoka", "Arial Rounded MT Bold", sans-serif; cursor: pointer; }
    .bookmark-filter:hover { border-color: #bfe9ff; color: #fff; }
    .bookmark-filter[aria-pressed="true"] { border-color: #bfe9ff; background: #bfe9ff; color: #292929; }
    .bookmark-filter:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .bookmark-item {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 16px;
      padding: 14px 0;
      border-top: 1px solid rgba(191, 233, 255, 0.25);
    }

    .bookmark-item[hidden] { display: none; }

    .bookmark-item img {
      width: 92px;
      aspect-ratio: 2 / 3;
      border-radius: 6px;
      object-fit: cover;
    }

    .bookmark-item h2 {
      margin: 0 0 8px;
      color: #bfe9ff;
      font: 600 1.1rem "Fredoka", "Arial Rounded MT Bold", sans-serif;
    }

    .bookmark-item p {
      margin: 5px 0 0;
      color: #d3d3d3;
      line-height: 1.5;
    }

    .bookmark-summary-toggle {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #d3d3d3;
      font: inherit;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
    }

    .bookmark-summary-toggle:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .bookmark-summary-text { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
    .bookmark-summary-toggle[aria-expanded="true"] .bookmark-summary-text { display: block; overflow: visible; -webkit-line-clamp: unset; }
    .bookmark-summary-action { display: block; margin-top: 4px; color: #bfe9ff; font: 500 .85rem "Fredoka", "Arial Rounded MT Bold", sans-serif; }

    .anime-progress {
      height: 52px;
      margin: 2px 0 4px;
      padding: 0 24px;
    }

    .progress-track {
      position: relative;
      height: 100%;
    }

    .progress-rail,
    .progress-fill {
      position: absolute;
      top: 50%;
      left: 0;
      height: 7px;
      border-radius: 5px;
      transform: translateY(-50%);
    }

    .progress-rail {
      right: 0;
      background: #555d62;
    }

    .progress-fill {
      width: var(--progress);
      background: #68c7f4;
      box-shadow: 0 0 8px rgba(104, 199, 244, 0.45);
    }

    .anime-progress.is-complete .progress-fill {
      background: #f1df7a;
      box-shadow: 0 0 8px rgba(241, 223, 122, 0.55);
    }

    .progress-character {
      position: absolute;
      top: 50%;
      left: var(--progress);
      width: 42px;
      height: 52px;
      overflow: visible;
      transform: translate(-50%, -50%);
      transition: left 700ms cubic-bezier(0.2, 0.75, 0.25, 1);
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.32));
      z-index: 1;
    }

    .progress-character svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .bookmark-item a { color: inherit; text-decoration: none; }
    .bookmark-empty { color: #d3d3d3; }
    .saved-item h2 { margin: 0; color: #bfe9ff; font: 600 1.1rem "Fredoka", "Arial Rounded MT Bold", sans-serif; }

    @media (max-width: 600px) {
      .tracker-content {
        margin-top: 30px;
      }

      .anime-progress { padding-inline: 20px; }
      .progress-character { width: 38px; height: 48px; }
      .tracker-tabs { gap: 14px; }
      .tracker-tab { font-size: .92rem; }
      .media-tabs { gap: 22px; margin-top: 30px; }
      .media-tab { font-size: 1.08rem; }
    }
  </style>

  <script>
    let activeBookmarkFilter = null;
    let bookmarkRecords = [];

    function isAnimeComplete(anime, episodeCount = Number(anime.episodeCount)) {
      return Boolean(anime.completed)
        || (Number.isFinite(episodeCount) && episodeCount > 0 && Number(anime.episodeProgress) >= episodeCount);
    }

    function applyBookmarkFilter() {
      const cards = [...document.querySelectorAll("#anime-bookmarks .bookmark-item")];
      let visibleCards = 0;
      cards.forEach((card) => {
        const matches = !activeBookmarkFilter || card.dataset.progressStatus === activeBookmarkFilter;
        card.hidden = !matches;
        if (matches) {
          visibleCards += 1;
        }
      });

      document.querySelectorAll(".bookmark-filter").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.filter === activeBookmarkFilter));
      });

      const emptyMessage = document.querySelector("#bookmark-filter-empty");
      emptyMessage.hidden = !activeBookmarkFilter || !bookmarkRecords.length || visibleCards > 0;
      emptyMessage.textContent = activeBookmarkFilter === "completed"
        ? "No completed anime bookmarks."
        : "No anime bookmarks in progress.";
    }

    document.querySelectorAll(".bookmark-filter").forEach((button) => {
      button.addEventListener("click", () => {
        activeBookmarkFilter = activeBookmarkFilter === button.dataset.filter ? null : button.dataset.filter;
        applyBookmarkFilter();
      });
    });

    function updateAnimeProgress(anime, episodeCount, progressLabel, progressMeter, isListedCount = false, units = {}) {
      const episodeProgress = Math.max(0, Number(anime.episodeProgress) || 0);
      const hasEpisodeCount = Number.isFinite(Number(episodeCount)) && Number(episodeCount) > 0;
      const totalEpisodes = hasEpisodeCount ? Number(episodeCount) : null;
      const isComplete = Boolean(anime.completed) || (hasEpisodeCount && episodeProgress >= totalEpisodes);
      const progressPercent = isComplete && !hasEpisodeCount
        ? 100
        : hasEpisodeCount ? Math.min(episodeProgress / totalEpisodes * 100, 100) : 0;
      const unit = units.unit || "Episode";
      const unitPlural = units.unitPlural || `${unit.toLowerCase()}s`;
      const progressGroup = units.group || "Season";
      const isOngoing = /airing|publishing/i.test(anime.status || "");
      const totalLabel = isListedCount ? ` listed ${unitPlural}` : isOngoing ? ` released ${unitPlural}` : ` ${unitPlural}`;

      progressMeter.style.setProperty("--progress", `${progressPercent}%`);
      progressMeter.classList.toggle("is-complete", isComplete);
      progressLabel.textContent = isComplete && !hasEpisodeCount
        ? `Progress: ${progressGroup} ${anime.seasonProgress || 1}, Complete`
        : hasEpisodeCount
          ? `Progress: ${progressGroup} ${anime.seasonProgress || 1}, ${unit} ${episodeProgress} of ${totalEpisodes}${totalLabel}${isComplete ? " · Complete" : ""}`
          : `Progress: ${progressGroup} ${anime.seasonProgress || 1}, ${unit} ${episodeProgress} · total ${unit.toLowerCase()} count unknown`;

      if (hasEpisodeCount) {
        progressMeter.setAttribute("aria-valuenow", String(Math.round(progressPercent)));
        progressMeter.setAttribute("aria-valuetext", `${unit} ${episodeProgress} of ${totalEpisodes}${totalLabel}${isComplete ? ", complete" : ""}`);
      } else if (isComplete) {
        progressMeter.setAttribute("aria-valuenow", "100");
        progressMeter.setAttribute("aria-valuetext", `Completed; total ${unit.toLowerCase()} count unknown`);
      } else {
        progressMeter.removeAttribute("aria-valuenow");
        progressMeter.setAttribute("aria-valuetext", `${unit} ${episodeProgress}; total ${unit.toLowerCase()} count unknown`);
      }
    }

    function appendBookmarkNote(details, manga, idPrefix) {
      if (manga.comment?.trim()) {
        const note = document.createElement("p");
        note.textContent = `My comment: ${manga.comment.trim()}`;
        details.append(note);
        return;
      }

      const summaryId = `${idPrefix}-${manga.id}`;
      const summaryToggle = document.createElement("button");
      summaryToggle.className = "bookmark-summary-toggle";
      summaryToggle.type = "button";
      summaryToggle.setAttribute("aria-expanded", "false");
      summaryToggle.setAttribute("aria-controls", summaryId);
      const summaryText = document.createElement("span");
      summaryText.className = "bookmark-summary-text";
      summaryText.id = summaryId;
      summaryText.textContent = `Summary: ${manga.synopsis || "Summary unavailable."}`;
      const actionLabel = document.createElement("span");
      actionLabel.className = "bookmark-summary-action";
      actionLabel.textContent = "Read more";
      summaryToggle.append(summaryText, actionLabel);
      summaryToggle.addEventListener("click", () => {
        const expanded = summaryToggle.getAttribute("aria-expanded") === "true";
        summaryToggle.setAttribute("aria-expanded", String(!expanded));
        actionLabel.textContent = expanded ? "Read more" : "Show less";
      });
      details.append(summaryToggle);
    }

    function renderCoverTitleCollection(collection, selector, emptyText, detailPage) {
      const target = document.querySelector(selector);
      if (!collection.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "bookmark-empty";
        emptyMessage.textContent = emptyText;
        target.append(emptyMessage);
        return;
      }
      collection.forEach((manga) => {
        const item = document.createElement("article");
        item.className = "bookmark-item saved-item";
        const link = document.createElement("a");
        link.href = `${detailPage}?id=${encodeURIComponent(manga.id)}`;
        const cover = document.createElement("img");
        cover.src = manga.cover;
        cover.alt = `Cover for ${manga.title}`;
        link.append(cover);
        const title = document.createElement("h2");
        const titleLink = document.createElement("a");
        titleLink.href = link.href;
        titleLink.textContent = manga.title;
        title.append(titleLink);
        item.append(link, title);
        target.append(item);
      });
    }

    function renderMangaBookmarks(bookmarks) {
      const target = document.querySelector("#manga-bookmarks");
      if (!bookmarks.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "bookmark-empty";
        emptyMessage.textContent = "Manga you bookmark will appear here.";
        target.append(emptyMessage);
        return;
      }

      bookmarks.forEach((manga) => {
        const item = document.createElement("article");
        item.className = "bookmark-item";
        const link = document.createElement("a");
        link.href = `manga-detail.html?id=${encodeURIComponent(manga.id)}`;
        const cover = document.createElement("img");
        cover.src = manga.cover;
        cover.alt = `Cover for ${manga.title}`;
        link.append(cover);
        const details = document.createElement("div");
        const heading = document.createElement("h2");
        const titleLink = document.createElement("a");
        titleLink.href = link.href;
        titleLink.textContent = manga.title;
        heading.append(titleLink);
        details.append(heading);

        const progressLabel = document.createElement("p");
        const progressMeter = document.createElement("div");
        progressMeter.className = "anime-progress";
        progressMeter.setAttribute("role", "progressbar");
        progressMeter.setAttribute("aria-label", `Reading progress for ${manga.title}`);
        progressMeter.setAttribute("aria-valuemin", "0");
        progressMeter.setAttribute("aria-valuemax", "100");
        const track = document.createElement("div");
        track.className = "progress-track";
        track.setAttribute("aria-hidden", "true");
        const rail = document.createElement("span");
        rail.className = "progress-rail";
        const fill = document.createElement("span");
        fill.className = "progress-fill";
        const character = document.createElement("span");
        character.className = "progress-character";
        character.append(document.querySelector("#tracker-character-template").content.cloneNode(true));
        track.append(rail, fill, character);
        progressMeter.append(track);
        details.append(progressLabel, progressMeter);

        const progressState = {
          ...manga,
          seasonProgress: manga.volumeProgress,
          episodeProgress: manga.chapterProgress,
          episodeCount: manga.chapterCount
        };
        updateAnimeProgress(progressState, manga.chapterCount, progressLabel, progressMeter, false, { unit: "Chapter", unitPlural: "chapters", group: "Volume" });
        appendBookmarkNote(details, manga, "manga-summary");
        item.append(link, details);
        target.append(item);
      });
    }

    async function loadListedEpisodeCount(animeId) {
      const cacheKey = `mam.episode-count.v1:${animeId}`;
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
        if (Number.isFinite(cached?.count) && Date.now() - cached.savedAt < 43200000) {
          return cached.count;
        }
      } catch {
        return null;
      }

      async function fetchEpisodePage(page) {
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 5000);
        try {
          const response = await fetch(`https://api.jikan.moe/v4/anime/${encodeURIComponent(animeId)}/episodes?page=${page}`, {
            signal: controller.signal
          });
          if (!response.ok) {
            throw new Error("Episode count is unavailable");
          }
          return response.json();
        } finally {
          window.clearTimeout(timeoutId);
        }
      }

      try {
        const firstPage = await fetchEpisodePage(1);
        const exactTotal = Number(firstPage.pagination?.items?.total);
        let count = Number.isFinite(exactTotal) && exactTotal > 0 ? exactTotal : null;
        if (!count) {
          const lastPage = Number(firstPage.pagination?.last_visible_page) || 1;
          const pageSize = Number(firstPage.pagination?.items?.per_page) || firstPage.data?.length || 0;
          if (lastPage === 1) {
            count = firstPage.data?.length || null;
          } else if (pageSize > 0) {
            await new Promise((resolve) => window.setTimeout(resolve, 400));
            const finalPage = await fetchEpisodePage(lastPage);
            count = (lastPage - 1) * pageSize + (finalPage.data?.length || 0);
          }
        }
        if (count) {
          try {
            localStorage.setItem(cacheKey, JSON.stringify({ count, savedAt: Date.now() }));
          } catch {
            return count;
          }
        }
        return count;
      } catch {
        return null;
      }
    }

    function setupTabList(tabList, panelScope) {
      const tabs = [...tabList.querySelectorAll('[role="tab"]')];
      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => {
          tabs.forEach((listTab) => {
            const isSelected = listTab === tab;
            listTab.setAttribute("aria-selected", String(isSelected));
            listTab.tabIndex = isSelected ? 0 : -1;
            panelScope.querySelector(`#${listTab.getAttribute("aria-controls")}`).hidden = !isSelected;
          });
        });
        tab.addEventListener("keydown", (event) => {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          event.preventDefault();
          const direction = event.key === "ArrowRight" ? 1 : -1;
          const nextIndex = (index + direction + tabs.length) % tabs.length;
          tabs[nextIndex].focus();
          tabs[nextIndex].click();
        });
      });
      return tabs;
    }

    const mediaTabList = document.querySelector(".media-tabs");
    const mediaSections = [...document.querySelectorAll(".media-section")];
    const mediaTabs = [...mediaTabList.querySelectorAll('[role="tab"]')];
    mediaTabs.forEach((tab, index) => {
      tab.addEventListener("click", () => {
        mediaTabs.forEach((mediaTab) => {
          const isSelected = mediaTab === tab;
          mediaTab.setAttribute("aria-selected", String(isSelected));
          mediaTab.tabIndex = isSelected ? 0 : -1;
          document.querySelector(`#${mediaTab.getAttribute("aria-controls")}`).hidden = !isSelected;
        });
      });
      tab.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        const nextIndex = (index + direction + mediaTabs.length) % mediaTabs.length;
        mediaTabs[nextIndex].focus();
        mediaTabs[nextIndex].click();
      });
    });

    mediaSections.forEach((section) => {
      setupTabList(section.querySelector(".tracker-tabs"), section);
    });

    const hashTabMap = {
      "#saved": ["tab-my-anime", "tab-saved"],
      "#favorites": ["tab-my-anime", "tab-favorites"],
      "#manga-bookmarked": ["tab-my-manga", "tab-manga-bookmarked"],
      "#manga-saved": ["tab-my-manga", "tab-manga-saved"],
      "#manga-favorites": ["tab-my-manga", "tab-manga-favorites"]
    };
    const hashTabIds = hashTabMap[window.location.hash];
    if (hashTabIds) {
      document.querySelector(`#${hashTabIds[0]}`).click();
      document.querySelector(`#${hashTabIds[1]}`).click();
    }

    window.MamAuth.getUser().then(({ data }) => {
      if (!data.user) {
        window.location.replace("index.html");
        return;
      }

      const timestamp = document.querySelector("#last-login-time");

      if (data.user.lastLoginAt) {
        const lastLogin = new Date(data.user.lastLoginAt);
        timestamp.dateTime = lastLogin.toISOString();
        timestamp.textContent = new Intl.DateTimeFormat(undefined, {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(lastLogin);
      } else {
        timestamp.textContent = "Not recorded";
      }

      const bookmarks = data.user.animeBookmarks || [];
      bookmarkRecords = bookmarks;
      const bookmarkList = document.querySelector("#anime-bookmarks");
      if (!bookmarks.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "bookmark-empty";
        emptyMessage.textContent = "Anime you bookmark will appear here.";
        bookmarkList.append(emptyMessage);
      } else {
        bookmarks.forEach((anime) => {
          const item = document.createElement("article");
          item.className = "bookmark-item";
          item.dataset.progressStatus = isAnimeComplete(anime) ? "completed" : "in-progress";
          const link = document.createElement("a");
          link.href = `anime-detail.html?id=${encodeURIComponent(anime.id)}`;
          const cover = document.createElement("img");
          cover.src = anime.cover;
          cover.alt = `Cover for ${anime.title}`;
          link.append(cover);

          const details = document.createElement("div");
          const title = document.createElement("h2");
          const titleLink = document.createElement("a");
          titleLink.href = link.href;
          titleLink.textContent = anime.title;
          title.append(titleLink);
          details.append(title);

          const progressLabel = document.createElement("p");
          details.append(progressLabel);

          const progressMeter = document.createElement("div");
          progressMeter.className = "anime-progress";
          progressMeter.setAttribute("role", "progressbar");
          progressMeter.setAttribute("aria-label", `Watch progress for ${anime.title}`);
          progressMeter.setAttribute("aria-valuemin", "0");
          progressMeter.setAttribute("aria-valuemax", "100");

          const progressTrack = document.createElement("div");
          progressTrack.className = "progress-track";
          progressTrack.setAttribute("aria-hidden", "true");
          const progressRail = document.createElement("span");
          progressRail.className = "progress-rail";
          const progressFill = document.createElement("span");
          progressFill.className = "progress-fill";
          const progressCharacter = document.createElement("span");
          progressCharacter.className = "progress-character";
          progressCharacter.append(document.querySelector("#tracker-character-template").content.cloneNode(true));
          progressTrack.append(progressRail, progressFill, progressCharacter);
          progressMeter.append(progressTrack);
          details.append(progressMeter);
          const knownEpisodeCount = Number(anime.episodeCount);
          updateAnimeProgress(anime, knownEpisodeCount, progressLabel, progressMeter);
          if (!(Number.isFinite(knownEpisodeCount) && knownEpisodeCount > 0)) {
            loadListedEpisodeCount(anime.id).then((listedEpisodeCount) => {
              if (listedEpisodeCount) {
                updateAnimeProgress(anime, listedEpisodeCount, progressLabel, progressMeter, true);
                item.dataset.progressStatus = isAnimeComplete(anime, listedEpisodeCount) ? "completed" : "in-progress";
                applyBookmarkFilter();
              }
            });
          }

          appendBookmarkNote(details, anime, "bookmark-summary");
          item.append(link, details);
          bookmarkList.append(item);
        });
      }
      applyBookmarkFilter();

      const savedAnime = data.user.animeList || [];
      const savedList = document.querySelector("#saved-anime");
      if (!savedAnime.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "bookmark-empty";
        emptyMessage.textContent = "Anime you save to watch later will appear here.";
        savedList.append(emptyMessage);
      } else {
        savedAnime.forEach((anime) => {
          const item = document.createElement("article");
          item.className = "bookmark-item saved-item";
          const link = document.createElement("a");
          link.href = `anime-detail.html?id=${encodeURIComponent(anime.id)}`;
          const cover = document.createElement("img");
          cover.src = anime.cover;
          cover.alt = `Cover for ${anime.title}`;
          link.append(cover);

          const title = document.createElement("h2");
          const titleLink = document.createElement("a");
          titleLink.href = link.href;
          titleLink.textContent = anime.title;
          title.append(titleLink);
          item.append(link, title);
          savedList.append(item);
        });
      }

      const favoriteAnime = data.user.favoriteAnime || [];
      const favoriteList = document.querySelector("#favorite-anime");
      if (!favoriteAnime.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "bookmark-empty";
        emptyMessage.textContent = "Anime you favorite will appear here.";
        favoriteList.append(emptyMessage);
      } else {
        favoriteAnime.forEach((anime) => {
          const item = document.createElement("article");
          item.className = "bookmark-item saved-item";
          const link = document.createElement("a");
          link.href = `anime-detail.html?id=${encodeURIComponent(anime.id)}`;
          const cover = document.createElement("img");
          cover.src = anime.cover;
          cover.alt = `Cover for ${anime.title}`;
          link.append(cover);

          const title = document.createElement("h2");
          const titleLink = document.createElement("a");
          titleLink.href = link.href;
          titleLink.textContent = anime.title;
          title.append(titleLink);
          item.append(link, title);
          favoriteList.append(item);
        });
      }

      renderMangaBookmarks(data.user.mangaBookmarks || []);
      renderCoverTitleCollection(data.user.mangaList || [], "#saved-manga", "Manga you save to read later will appear here.", "manga-detail.html");
      renderCoverTitleCollection(data.user.favoriteManga || [], "#favorite-manga", "Manga you favorite will appear here.", "manga-detail.html");
    });
  </script>
</body>
</html>
