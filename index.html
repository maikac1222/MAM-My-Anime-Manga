<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root {
      font-family: "Avenir Next", Avenir, sans-serif;
      color: #202322;
      background: #f4f5f1;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      transition: background-color 300ms ease;
    }

    main {
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 1;
      font-weight: 700;
    }

    button {
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 4px;
      background: #202322;
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms ease, background-color 150ms ease;
    }

    button:hover {
      background: #39413d;
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
      box-shadow: 0 0 0 6px #202322;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello World</h1>
    <button id="color-button" type="button">Change background</button>
  </main>

  <script>
    const colorButton = document.querySelector("#color-button");

    colorButton.addEventListener("click", () => {
      const randomColor = `hsl(${Math.floor(Math.random() * 360)} 65% 78%)`;
      document.body.style.backgroundColor = randomColor;
    });
  </script>
</body>
</html>
