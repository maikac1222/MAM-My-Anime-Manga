<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an Account | MAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #292929;
      --accent: #bfe9ff;
      font-family: "Avenir Next", Avenir, sans-serif;
      color: var(--accent);
      background: var(--background);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px;
      background: var(--background);
    }

    main {
      width: min(100%, 420px);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-family: "Fredoka", "Arial Rounded MT Bold", sans-serif;
      font-size: clamp(2.25rem, 8vw, 3rem);
      line-height: 1.1;
      text-align: center;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    .entry-box {
      min-height: 68px;
      padding: 10px 18px;
      border: 2px solid rgba(191, 233, 255, 0.78);
      border-radius: 18px;
      background: #333333;
      box-shadow: 0 4px 0 rgba(191, 233, 255, 0.12);
    }

    label {
      display: block;
      margin-bottom: 2px;
      color: var(--accent);
      font-family: "Fredoka", "Arial Rounded MT Bold", sans-serif;
      font-size: 0.85rem;
      line-height: 1;
    }

    .entry-box label {
      text-align: left;
    }

    input {
      width: 100%;
      min-height: 28px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--accent);
      font: 500 1rem "Fredoka", "Arial Rounded MT Bold", sans-serif;
    }

    .password-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .password-input-row input {
      flex: 1;
      width: 0;
      min-width: 0;
    }

    input::placeholder {
      color: var(--accent);
      font-size: 0.78rem;
      opacity: 0.55;
    }

    .password-toggle {
      display: grid;
      flex: 0 0 32px;
      width: 32px;
      height: 28px;
      min-height: 28px;
      place-items: center;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      box-shadow: none;
    }

    .password-toggle:hover {
      background: rgba(191, 233, 255, 0.12);
    }

    .password-toggle:focus-visible {
      outline-offset: 1px;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .eye-slash {
      display: block;
    }

    .password-toggle[aria-pressed="true"] .eye-slash {
      display: none;
    }

    .entry-box:focus-within {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(191, 233, 255, 0.2);
    }

    button {
      justify-self: center;
      width: min(100%, 220px);
      min-height: 54px;
      margin-top: 4px;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: var(--background);
      font: 600 1.1rem "Fredoka", "Arial Rounded MT Bold", sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(191, 233, 255, 0.28);
    }

    button:hover {
      background: #d9f2ff;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .form-message {
      min-height: 1.25em;
      margin: 0;
      color: #ffd1d1;
      font-family: "Fredoka", "Arial Rounded MT Bold", sans-serif;
      font-size: 0.95rem;
      text-align: center;
    }

    .login-link {
      display: block;
      margin-top: 18px;
      color: var(--accent);
      font-family: "Fredoka", "Arial Rounded MT Bold", sans-serif;
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <form id="signup-form" autocomplete="off">
      <div class="entry-box">
        <label for="new-username">Username</label>
        <input id="new-username" name="username" type="text" autocomplete="username" maxlength="25" placeholder="Maximum 25 characters" required>
      </div>
      <div class="entry-box">
        <label for="new-email">Email</label>
        <input id="new-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="entry-box">
        <label for="new-password">Password</label>
        <div class="password-input-row">
          <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="18" placeholder="Maximum 18 characters" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" aria-controls="new-password">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="eye-slash" d="M4 4 20 20"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="entry-box">
        <label for="confirm-password">Confirm password</label>
        <div class="password-input-row">
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="18" placeholder="Maximum 18 characters" required>
          <button class="password-toggle" type="button" aria-label="Show confirm password" aria-pressed="false" aria-controls="confirm-password">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="eye-slash" d="M4 4 20 20"></path>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit">Create account</button>
      <p class="form-message" id="signup-message" role="alert" aria-live="polite"></p>
    </form>
    <a class="login-link" href="index.html">Back to login</a>
  </main>
  <script src="auth.js?v=account-menu-settings-v7-202610"></script>
  <script>
    document.querySelectorAll(".password-toggle").forEach((toggle) => {
      const passwordField = document.getElementById(toggle.getAttribute("aria-controls"));

      toggle.addEventListener("click", () => {
        const showingPassword = passwordField.type === "password";
        passwordField.type = showingPassword ? "text" : "password";
        toggle.setAttribute("aria-pressed", String(showingPassword));
        toggle.setAttribute("aria-label", `${showingPassword ? "Hide" : "Show"} ${passwordField.id === "new-password" ? "password" : "confirm password"}`);
      });
    });

    document.querySelector("#signup-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const username = document.querySelector("#new-username").value;
      const email = document.querySelector("#new-email").value;
      const password = document.querySelector("#new-password").value;
      const confirmPassword = document.querySelector("#confirm-password").value;
      const message = document.querySelector("#signup-message");
      message.style.color = "#ffd1d1";

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      try {
        const { data, error } = await window.MamAuth.createAccount({ username, email, password });
        if (error) {
          message.textContent = error.message;
          return;
        }

        message.style.color = "var(--accent)";
        message.textContent = `${data.account.username}'s account is saved in this browser. You can now log in.`;
      } catch {
        message.textContent = "Unable to save this account. Try again.";
      }
    });
  </script>
</body>
</html>
